version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: hospital_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_user} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_net

  # FastAPI Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hospital_fastapi_server
    restart: always
    environment:
      DATABASE_URL: postgresql://hospital_user:hospital_password@db:5432/hospital_db
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_123456789}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital_net

  # React Vite Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hospital_react_client
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - hospital_net

volumes:
  pgdata:
    driver: local

networks:
  hospital_net:
    driver: bridge
