version: '3.8'

services:
  # FastAPI Backend Service (Connects directly to Neon PostgreSQL Cloud DB)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hospital_fastapi_server
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:YOUR_PASSWORD@ep-sample-123456.us-east-2.aws.neon.tech/neondb?sslmode=require}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_123456789}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    networks:
      - hospital_net

  # React Vite Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hospital_react_client
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - hospital_net

networks:
  hospital_net:
    driver: bridge
